name: Update LinkedIn Feed

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    # This explicitly gives the runner permission to push code back
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # This ensures the token is used for all git commands
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Personal Posts via RapidAPI
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
        run: |
          node - <<'EOF'
          const https = require("https");
          const fs = require("fs");

          const API_KEY = process.env.RAPIDAPI_KEY;
          const USERNAME = process.env.LINKEDIN_USERNAME;
          const JSON_PATH = "linkedin-posts.json";

          function apiRequest(url) {
            return new Promise((resolve, reject) => {
              const options = {
                method: 'GET',
                headers: {
                  'x-rapidapi-key': API_KEY,
                  'x-rapidapi-host': 'linkedin-data-api.p.rapidapi.com',
                  'Content-Type': 'application/json'
                }
              };
              https.get(url, options, (res) => {
                let data = "";
                res.on("data", (chunk) => (data += chunk));
                res.on("end", () => {
                  if (res.statusCode >= 400) reject(new Error(`API Error ${res.statusCode}: ${data}`));
                  else {
                    try { resolve(JSON.parse(data)); }
                    catch (e) { reject(new Error("Parse fail: " + data)); }
                  }
                });
              }).on("error", reject);
            });
          }

          async function main() {
            console.log("Fetching for:", USERNAME);
            const url = `https://linkedin-data-api.p.rapidapi.com/get-profile-posts?username=${USERNAME}`;
            const response = await apiRequest(url);
            const posts = response.data || response.results || [];

            const formatted = posts.map(p => ({
              id: p.id || p.urn || Math.random().toString(36).substr(2, 9),
              date: p.postedAt || new Date().toISOString().split('T')[0],
              text: p.text || p.summary || "",
              hashtags: (p.text || "").split(/\s+/).filter(w => w.startsWith("#")),
              reactions: p.likeCount || 0,
              comments: p.commentCount || 0
            })).filter(p => p.text.trim().length > 0);

            let existing = [];
            if (fs.existsSync(JSON_PATH)) existing = JSON.parse(fs.readFileSync(JSON_PATH, "utf8"));
            const ids = new Set(existing.map(p => p.id));
            const fresh = formatted.filter(p => !ids.has(p.id));

            fs.writeFileSync(JSON_PATH, JSON.stringify([...fresh, ...existing], null, 2));
            console.log(`Success! Found ${fresh.length} new posts.`);
          }
          main().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkedin-posts.json
          # Only commit and push if there are actually changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update linkedin-posts.json"
            git push origin main
          fi
