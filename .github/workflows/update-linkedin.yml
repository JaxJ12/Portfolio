name: Update LinkedIn Feed

on:
  schedule:
    - cron: '0 8 * * *'   # daily at 8am UTC
  workflow_dispatch:        # allow manual trigger from Actions tab

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch posts via LinkdAPI and update JSON
        env:
          LINKDAPI_KEY: ${{ secrets.LINKD_API }}
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
        run: |
          node - <<'EOF'
          const https = require("https");
          const fs   = require("fs");

          const API_KEY  = process.env.LINKDAPI_KEY;
          const USERNAME = process.env.LINKEDIN_USERNAME;
          const OUT_PATH = "linkedin-posts.json";

          if (!API_KEY || !USERNAME) {
            console.error("Missing LINKDAPI_KEY or LINKEDIN_USERNAME secret — add them in repo Settings > Secrets.");
            process.exit(1);
          }

          function get(path) {
            return new Promise((resolve, reject) => {
              const req = https.request({
                hostname: "linkdapi.com",
                path,
                method: "GET",
                headers: {
                  "X-linkdapi-apikey": API_KEY,
                  "Content-Type": "application/json"
                }
              }, res => {
                let body = "";
                res.on("data", c => body += c);
                res.on("end", () => {
                  console.log("Status:", res.statusCode);
                  if (res.statusCode >= 400) {
                    reject(new Error(`API returned ${res.statusCode}: ${body.slice(0, 300)}`));
                  } else {
                    try { resolve(JSON.parse(body)); }
                    catch (e) { reject(new Error("JSON parse failed: " + body.slice(0, 200))); }
                  }
                });
              });
              req.on("error", reject);
              req.end();
            });
          }

          function toISODate(val) {
            if (!val) return new Date().toISOString().slice(0, 10);
            let ms = typeof val === "number"
              ? (val < 1e12 ? val * 1000 : val)
              : Date.parse(val);
            const d = new Date(ms);
            return isNaN(d) ? new Date().toISOString().slice(0, 10) : d.toISOString().slice(0, 10);
          }

          function timeAgo(isoDate) {
            const days = Math.round((Date.now() - new Date(isoDate)) / 86400000);
            if (days < 1)   return "Today";
            if (days < 7)   return days + "d";
            if (days < 30)  return Math.round(days / 7) + "w";
            if (days < 365) return Math.round(days / 30) + "mo";
            return Math.round(days / 365) + "y";
          }

          (async () => {
            try {
              console.log("Fetching posts for:", USERNAME);
              const data = await get(`/api/v1/posts/all?username=${encodeURIComponent(USERNAME)}`);

              console.log("API response keys:", Object.keys(data));
              console.log("API response preview:", JSON.stringify(data).slice(0, 500));

              const raw = Array.isArray(data)
                ? data
                : (data.data || data.posts || data.items || data.results || []);

              if (!raw.length) {
                console.log("No posts returned from API — leaving existing JSON unchanged.");
                process.exit(0);
              }

              const posts = raw
                .filter(p => (p.text || p.commentary || p.content || "").trim().length > 20)
                .sort((a, b) => {
                  const aDate = a.postedAt || a.publishedAt || a.createdAt || a.date || 0;
                  const bDate = b.postedAt || b.publishedAt || b.createdAt || b.date || 0;
                  const toMs = v => typeof v === "number" ? (v < 1e12 ? v * 1000 : v) : Date.parse(v) || 0;
                  return toMs(bDate) - toMs(aDate);
                })
                .slice(0, 10)
                .map((p, i) => {
                  const text      = (p.text || p.commentary || p.content || "").trim();
                  const rawDate   = p.postedAt || p.publishedAt || p.createdAt || p.date;
                  const isoDate   = toISODate(rawDate);
                  const reactions = p.totalReactionCount || p.numLikes || p.likeCount || p.reactions || 0;
                  const comments  = p.commentsCount || p.numComments || p.commentCount || p.comments || 0;
                  const hashtags  = (text.match(/#\w+/g) || []).slice(0, 6);
                  const image     = p.image?.[0]?.url || p.images?.[0]?.url || p.thumbnail || null;

                  return {
                    id:           "li-" + String(i + 1).padStart(3, "0"),
                    date:         isoDate,
                    dateLabel:    timeAgo(isoDate),
                    text,
                    hashtags,
                    reactions,
                    reactionTypes: "👍❤️🎉",
                    comments,
                    image
                  };
                });

              fs.writeFileSync(OUT_PATH, JSON.stringify(posts, null, 2));
              console.log(`Wrote ${posts.length} posts to ${OUT_PATH}`);
            } catch (err) {
              console.error("Failed:", err.message);
              process.exit(1);
            }
          })();
          EOF

      - name: Commit updated JSON if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkedin-posts.json
          if git diff --staged --quiet; then
            echo "No changes — feed is already up to date."
          else
            git commit -m "chore: auto-update linkedin-posts.json [skip ci]"
            git push origin main
          fi
